version: '3.8'

services:
  threat-service:
    image: mockoon/cli:latest
    ports:
      - "8081:8081"
    command: ["-d", "https://raw.githubusercontent.com/mockoon/mock-samples/main/samples/petstore.json", "-p", "8081", "-l", "0.0.0.0"]

  api-gateway:
    image: node:18-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./server.js:/app/server.js
    working_dir: /app
    command: ["node", "server.js"]