server:
  port: 8084

spring:
  application:
    name: threat-detection-service-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:threatdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    issuer: test-issuer

threat-detection:
  weights:
    root-jailbreak: 40
    frida-hook: 50
    debugger: 30
    integrity: 35
    emulator: 15
    velocity-burst: 20
  velocity-threshold-per-minute: 10
