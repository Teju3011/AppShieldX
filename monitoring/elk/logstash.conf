input {
  # Beats input from Filebeat agents
  beats {
    port => 5044
  }

  # Direct TCP input for microservices logback logstash encoder
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse JSON payloads if received as raw text
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Enrich security events
  if [logger_name] =~ /com\.framework/ {
    mutate {
      add_tag => ["framework_security_event"]
    }
  }

  # Add GeoIP or IP enrichment if client IP exists
  if [client_ip] {
    mutate {
      add_field => { "source_ip" => "%{client_ip}" }
    }
  }

  # Date parsing for timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "security-logs-%{+YYYY.MM.dd}"
  }
  
  # Standard stdout debugging
  stdout {
    codec => rubydebug
  }
}
