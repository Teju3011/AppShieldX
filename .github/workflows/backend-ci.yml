name: Backend Microservices CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - business-service
          - threat-detection-service
          - audit-logging-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests with Maven
        working-directory: backend/${{ matrix.service }}
        run: |
          mvn clean test -B -Dstyle.color=always

      - name: Package JAR Artifact
        working-directory: backend/${{ matrix.service }}
        run: |
          mvn package -DskipTests -B

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/
