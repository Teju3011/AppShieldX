name: mobile_security_reference_app
description: "Cloud Native Runtime Protection & API Security Framework - Flutter Reference Implementation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking & Security
  dio: ^5.4.3+1
  crypto: ^3.0.3
  uuid: ^4.4.0
  
  # Navigation
  go_router: ^14.1.4
  
  # Secure Storage & Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0
  
  # Persistence for Offline Security Event Queue
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  
  # UI & Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
