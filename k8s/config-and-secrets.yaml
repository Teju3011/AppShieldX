apiVersion: v1
kind: ConfigMap
metadata:
  name: security-framework-config
  namespace: security-framework
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.security-framework.svc.cluster.local:5432/security_framework_db"
  SPRING_DATA_REDIS_HOST: "redis.security-framework.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  AUTH_SERVICE_URL: "http://auth-service.security-framework.svc.cluster.local:8081"
  USER_SERVICE_URL: "http://user-service.security-framework.svc.cluster.local:8082"
  BUSINESS_SERVICE_URL: "http://business-service.security-framework.svc.cluster.local:8083"
  THREAT_SERVICE_URL: "http://threat-detection-service.security-framework.svc.cluster.local:8084"
  AUDIT_SERVICE_URL: "http://audit-logging-service.security-framework.svc.cluster.local:8085"
  JWT_ACCESS_EXPIRATION_MS: "900000"
  JWT_REFRESH_EXPIRATION_MS: "604800000"
---
